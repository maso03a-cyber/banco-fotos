<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Pago con tarjeta · College Traveler</title>
<link rel="icon" href="/marca/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#F6F8FA;font-family:Lato,Helvetica,Arial,sans-serif;color:#14142B;-webkit-font-smoothing:antialiased}
.c{max-width:520px;margin:40px auto;background:#fff;border:1px solid #E7EBF0;border-radius:14px;padding:36px 30px}
.logo{font-weight:900;letter-spacing:4px;font-size:15px}.logo b{color:#009DE0}
.viaje{font-size:12.5px;color:#8A93A1;letter-spacing:1.6px;text-transform:uppercase;margin:26px 0 10px;min-height:16px}
.pie{font-size:13px;color:#8A93A1;margin-top:28px;border-top:1px solid #E7EBF0;padding-top:16px;line-height:1.6}
.pie a{color:#009DE0}
@media (max-width:560px){.c{margin:16px;padding:28px 20px}}
</style></head><body>
<div class="c">
  <div class="logo">COLLEGE <b>TRAVELER•</b></div>
  <div class="viaje" id="viaje"></div>
  <div data-ctpago id="ctpago"></div>
  <div class="pie">¿Dudas? Escríbenos a <a href="mailto:contacto@collegetraveler.com">contacto@collegetraveler.com</a> o por <a href="https://wa.me/522282728556">WhatsApp al 228 272 8556</a>.</div>
</div>
<script>
document.getElementById('ctpago').addEventListener('ctp:viaje',function(e){var v=e.detail;document.getElementById('viaje').textContent=v.evento+(v.destino?' · '+v.destino:'')});
</script>
<script src="/tarjeta/pago.js?v=2"></script>
