name: Fotos de ciudades y mapas de hoteles
on:
  push:
    paths: [ciudades.txt, hoteles.txt]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bajar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests pillow matplotlib
      - name: Bajar fotos de las ciudades nuevas
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python herramientas/bajar_fotos_ciudad.py
      - name: Mapas de alrededores de los hoteles
        run: python herramientas/mapa_hotel.py
      - name: Guardar en el repo
        run: |
          git config user.name "banco-fotos-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Fotos de ciudades nuevas"
          git push
